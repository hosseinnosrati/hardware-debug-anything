[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-debug-anything"
version = "0.1.0"
description = "Autonomous MCP Server for Embedded Hardware Debugging, Renode Simulation, Silicon Fault Analysis & Protocol Decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hossein Nosrati", email = "hnosrati0@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "embedded",
    "hardware-debugging",
    "arm-cortex-m",
    "esp32",
    "hardfault",
    "renode",
    "i2c",
    "claude-code",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=4.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/hosseinnosrati/hardware-debug-anything"
Repository = "https://github.com/hosseinnosrati/hardware-debug-anything.git"

[project.scripts]
hda = "hda.server:main"
hda-mcp = "hda.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hda*"]
